name: Update airport database

on:
  schedule:
    - cron: "18 8 * * 5"
  workflow_dispatch:

concurrency:
  group: update-airport-database
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  update-airports:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend_scripts/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_scripts/requirements.txt

      - name: Run airport database update
        env:
          PYTHONUNBUFFERED: "1"
        run: python backend_scripts/xc_airport_db.py

      # GitHub disables scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow on each run resets that timer.
      - name: Keep scheduled workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update_airport_db.yml/enable"
